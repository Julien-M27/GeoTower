[package]
name = "geotower_builder"
version = "0.1.0"
edition = "2021"

[lib]
name = "geotower_builder"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
csv = "1.3"
flate2 = "1.0"
jni = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
